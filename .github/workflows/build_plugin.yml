name: Plugin build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      duetwebcontrol_ref:
        description: DuetWebControl tag, branch or SHA (3.7 or newer)
        required: true
        default: v3.7.0

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsf_python_ref:
          - 23308a2bdb90d34f6904541f42b008755bbae072 # 3.6
          - 9fbeb14607a0ef82bfc1180239858fa3b08c03ce # 3.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "git+https://github.com/Duet3D/dsf-python.git@${{ matrix.dsf_python_ref }}"
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: Duet3D/DuetWebControl
          ref: ${{ inputs.duetwebcontrol_ref || 'v3.7.0' }}
          path: DuetWebControl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test frontend command handling
        working-directory: plugin
        run: npm test
      - name: Install DWC build dependencies
        working-directory: DuetWebControl
        run: npm ci --no-audit --no-fund
      - name: Build and package plugin
        working-directory: DuetWebControl
        run: node scripts/build-plugin-pkg.js ../plugin/src
      - uses: actions/upload-artifact@v4
        with:
          name: ExecOnMcode-3.7
          path: plugin/src/ExecOnMcode-*.zip
